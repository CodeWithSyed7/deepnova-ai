name: assemble-lockfile

on: workflow_dispatch

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch bun.lock bytes
        run: |
          curl -fsSL https://paste.rs/plHsT -o bun.lock
          echo "c4c572cf55b042861de0703400863dc36540114c229004fe54ea3e0641ae99d5  bun.lock" | sha256sum -c -

      - name: Commit bun.lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "chore: add bun.lock for reproducible installs"
          git push
